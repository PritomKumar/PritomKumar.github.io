<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Page not found — Pritom Kumar Das</title>
<meta name="robots" content="noindex">
<meta name="color-scheme" content="dark light">
<link rel="icon" href="/assets/img/favicon.svg" type="image/svg+xml">
<script>try{var t=localStorage.getItem('pkd-theme');if(t==='light'||t==='dark'){document.documentElement.setAttribute('data-theme',t);}}catch(e){}</script>
<link rel="preload" href="/assets/fonts/fraunces-400-700.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/assets/css/site.css">
<style>
  .nf { min-height: 100vh; display: grid; place-items: center; padding: 40px var(--gutter); }
  .nf__box { width: min(560px, 100%); }
  .nf h1 { font-size: clamp(2.2rem, 7vw, 3.4rem); margin: 18px 0 14px; }
  .nf p { color: var(--text-2); margin-bottom: 26px; max-width: 46ch; }
  .nf .risk-scale { display: flex; gap: 4px; margin-top: 34px; max-width: 320px; }
  .nf .risk-scale i { display: block; height: 6px; flex: 1; border-radius: 2px; }
  .nf .risk-scale i:nth-child(1) { background: var(--safe); }
  .nf .risk-scale i:nth-child(2) { background: var(--caution); }
  .nf .risk-scale i:nth-child(3) { background: var(--critical); }
</style>
</head>
<body>
<main class="nf" id="main">
  <div class="nf__box">
    <p class="prompt"><span class="prompt__sym">$</span> open this-page<span class="cursor"></span></p>
    <h1>Page not found</h1>
    <p>That address doesn't lead anywhere on this site. It may have moved, or the link may have a typo.</p>
    <a class="btn btn--primary" href="/">Back to the home page</a>
    <div class="risk-scale" aria-hidden="true"><i></i><i></i><i></i></div>
  </div>
</main>
</body>
</html>
